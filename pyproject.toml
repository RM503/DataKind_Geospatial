[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datakind-geospatial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.79",
    "boto3-stubs[s3]~=1.42.79",
    "botocore>=1.42.79",
    "dask>=2026.3.0",
    "earthengine-api>=1.7.20",
    "fiona>=1.10.1",
    "geopandas>=1.1.3",
    "kedro>=1.3.1",
    "kedro-datasets[geopandas,pandas,pickle]>=9.3.0",
    "kedro-mlflow>=2.0.2",
    "kedro-sagemaker>=0.4.0",
    "kedro-viz>=12.3.0",
    "lightgbm>=4.6.0",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.8",
    "mlflow>=3.10.1",
    "numba>=0.65.1",
    "numpy>=2.3,<2.4",
    "opencv-python>=4.13.0.92",
    "optuna>=4.8.0",
    "pandas>=2.3.3",
    "pandera>=0.30.1",
    "protobuf>=6.33.6",
    "pyproj>=3.7.2",
    "pystac>=1.14.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.0",
    "rasterstats>=0.20.0",
    "sagemaker>=3.7.1",
    "scikit-learn>=1.6,<1.8",
    "scipy>=1.17.1",
    "scipy-stubs~=1.17.1",
    "seaborn>=0.13.2",
    "sentinelhub>=3.11.5",
    "shapely>=2.1.2",
    "sktime>=0.40.0",
    "statsmodels>=0.14.6",
    "supabase>=2.28.3",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
notebooks = [
    "cartopy>=0.25.0",
    "folium>=0.20.0",
    "geemap>=0.37.2",
    "gradio>=6.12.0",
    "holoviews>=1.22.1",
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.6",
]

[project.scripts]
datakind-geospatial = "datakind_geospatial.__main__:main"

[project.entry-points."kedro.hooks"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.kedro]
package_name = "datakind_geospatial"
project_name = "datakind-geospatial"
kedro_init_version = "1.3.1"
tools = "['None']"
example_pipeline = "False"
source_dir = "src"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E402", "PLR0913"]
select = [
    "F",   # Pyflakes
    "W",   # pycodestyle
    "E",   # pycodestyle
    "UP",  # pyupgrade
    "PL",  # Pylint
    "T201", # Print Statement
]

[tool.kedro_telemetry]
project_id = "16979dfd1418435e91d9106231cc94c0"
