[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datakind-geospatial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.79",
    "boto3-stubs[s3]~=1.42.79",
    "botocore>=1.42.79",
    "cartopy>=0.25.0",
    "dask>=2026.3.0",
    "earthengine-api>=1.7.20",
    "fiona>=1.10.1",
    "geopandas>=1.1.3",
    "gradio>=6.12.0",
    "holoviews>=1.22.1",
    "ipykernel>=7.2.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "mlflow>=3.10.1",
    "numpy>=2.3,<2.4",
    "opencv-python>=4.13.0.92",
    "optuna>=4.8.0",
    "pandas>=2.3.3",
    "pandera>=0.30.1",
    "panel>=1.8.10",
    "protobuf>=6.33.6",
    "pyproj>=3.7.2",
    "pyspark>=4.1.1",
    "pystac>=1.14.3",
    "python-dotenv>=1.2.2",
    "rasterio>=1.5.0",
    "rasterstats>=0.20.0",
    "sagemaker>=3.7.1",
    "scikit-learn>=1.6,<1.8",
    "scipy>=1.17.1",
    "scipy-stubs~=1.17.1",
    "seaborn>=0.13.2",
    "sentinelhub>=3.11.5",
    "shapely>=2.1.2",
    "sktime>=0.40.0",
    "statsmodels>=0.14.6",
    "supabase>=2.28.3",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "xgboost>=3.2.0",
]

[tools.setuptools]
package-dir = {"" = "src"}

[tools.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["E402"]
